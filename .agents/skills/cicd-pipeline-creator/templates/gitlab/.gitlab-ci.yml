# Source: docs.gitlab.com/ci/yaml + publisher docs for gitleaks/trivy images
# Fetched: '@@FETCH_DATE@@'   Upstream ref: '@@UPSTREAM_REF@@'
# TODO(verify): image names/tags, auto_cancel syntax, gitleaks subcommand

stages: [build, scan, test, deploy]

workflow:
  auto_cancel:
    on_new_commit: interruptible            # deploy jobs set interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never                           # no duplicate branch + MR pipelines
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true
  retry:
    max: 1
    when: runner_system_failure

variables:
  GIT_DEPTH: "20"
  ALLOW_NO_TESTS: "false"                   # project CI/CD variables override these
  DEPLOY_ENABLED: "false"

.deps-cache:
  cache:
    key:
      files: ['@@LOCKFILE@@']
    paths: ['@@CACHE_PATH@@']

build:
  extends: .deps-cache
  stage: build
  image: '@@BUILD_IMAGE@@'                  # pinned tag or digest, never :latest
  timeout: 15m
  script:
    - |
      set -eu
      cd '@@WORKING_DIR@@'
      @@INSTALL_CMD@@
      @@BUILD_CMD@@
    - test -n "$(ls -A '@@ARTIFACT_PATH@@')"   # fail on empty output (path is repo-root relative)
  artifacts:
    name: build-$CI_PIPELINE_ID
    paths: ['@@ARTIFACT_PATH@@/']
    expire_in: 1 week

secret_scan:
  stage: scan
  image:
    name: ghcr.io/gitleaks/gitleaks:@@GITLEAKS_VERSION@@
    entrypoint: [""]
  needs: []                                 # source scan: starts immediately, in parallel with build
  timeout: 15m
  variables:
    GIT_DEPTH: "0"                          # full history
  script:
    - gitleaks detect --source . --redact --exit-code 1

dependency_scan:
  stage: scan
  image:
    name: aquasec/trivy:@@TRIVY_VERSION@@
    entrypoint: [""]
  needs: []
  timeout: 15m
  script:
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed .

test:
  extends: .deps-cache
  stage: test
  image: '@@BUILD_IMAGE@@'
  needs:
    - job: build
      artifacts: false                      # reinstall: tests need dev deps the artifact lacks
  timeout: 20m
  script:
    - |
      set -eu
      cd '@@WORKING_DIR@@'
      @@INSTALL_CMD@@
      if [ '@@TEST_CMD@@' = 'NO_TESTS_DETECTED' ]; then
        if [ "$ALLOW_NO_TESTS" = "true" ]; then
          echo "WARNING: no tests detected, continuing because ALLOW_NO_TESTS=true"; exit 0
        fi
        echo "ERROR: no tests detected. Add tests or set ALLOW_NO_TESTS=true"; exit 1
      fi
      @@TEST_CMD@@
  # Add a stack-specific JUnit/coverage reporter only when the test command
  # is configured to produce that format. Generic tests are not assumed to emit XML.

deploy_skipped_notice:                      # a skipped deploy shows orange, never plain green
  stage: deploy
  image: '@@DEPLOY_IMAGE@@'
  needs: [secret_scan, dependency_scan, test]
  timeout: 5m
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_ENABLED != "true"'
  allow_failure:
    exit_codes: 64
  script:
    - echo "WARNING - Deploy skipped. Set CI/CD variable DEPLOY_ENABLED=true."
    - exit 64

deploy_staging:
  stage: deploy
  image: '@@DEPLOY_IMAGE@@'                 # must contain curl and the deploy CLI
  needs:
    - job: build
      artifacts: true
    - secret_scan
    - dependency_scan
    - test
  timeout: 20m
  interruptible: false
  resource_group: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_ENABLED == "true"'
  environment:
    name: staging
    url: '@@STAGING_URL@@'
  id_tokens:
    DEPLOY_OIDC_TOKEN:
      aud: '@@OIDC_AUDIENCE@@'              # short-lived token, no stored cloud keys
  script:
    - ': "${DEPLOY_TARGET:?DEPLOY_TARGET is not set}"'
    - |
      @@DEPLOY_CMD_STAGING@@
    # Azure example (TODO verify): az login --service-principal -u "$AZURE_CLIENT_ID" -t "$AZURE_TENANT_ID" --federated-token "$DEPLOY_OIDC_TOKEN"
    - curl --fail --retry 5 --retry-delay 5 --retry-all-errors "@@STAGING_URL@@"

deploy_production:
  stage: deploy
  image: '@@DEPLOY_IMAGE@@'
  needs:
    - job: build
      artifacts: true                       # same artifact staging received
    - deploy_staging
  timeout: 20m
  interruptible: false
  resource_group: production
  allow_failure: false                      # a manual job otherwise defaults to true and never blocks
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_ENABLED == "true"'
      when: manual
  environment:
    name: production
    url: '@@PRODUCTION_URL@@'
  id_tokens:
    DEPLOY_OIDC_TOKEN:
      aud: '@@OIDC_AUDIENCE@@'
  script:
    - ': "${DEPLOY_TARGET:?DEPLOY_TARGET is not set}"'
    - |
      @@DEPLOY_CMD_PRODUCTION@@
    - curl --fail --retry 5 --retry-delay 5 --retry-all-errors "@@PRODUCTION_URL@@"