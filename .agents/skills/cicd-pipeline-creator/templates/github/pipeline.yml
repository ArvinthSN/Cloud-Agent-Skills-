# Source: reviewed GitHub Actions starter and official publisher examples
# Fetched: @@FETCH_DATE@@   Template revision: @@UPSTREAM_REF@@
# Third-party actions are pinned to immutable commit SHAs; refresh pins through reviewed releases.
name: CI pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PROJECT_LANGUAGE: @@LANGUAGE@@

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python
        if: env.PROJECT_LANGUAGE == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '@@PYTHON_VERSION@@'
      - name: Set up Node.js
        if: env.PROJECT_LANGUAGE == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '@@NODE_VERSION@@'
      - uses: actions/cache@8ff5423e8b66eacab4e638ee52abbd2cb831366a # v5.0.1
        with:
          path: @@CACHE_PATH@@
          key: ${{ runner.os }}-deps-${{ hashFiles('@@WORKING_DIR@@/@@LOCKFILE@@') }}
      - name: Install dependencies
        run: @@INSTALL_CMD@@
        working-directory: @@WORKING_DIR@@
      - name: Build distributable
        run: @@BUILD_CMD@@
        working-directory: @@WORKING_DIR@@
      - name: Verify distributable
        run: |
          test -d '@@WORKING_DIR@@/@@ARTIFACT_PATH@@'
          test -n "$(find '@@WORKING_DIR@@/@@ARTIFACT_PATH@@' -type f -print -quit)"
      - uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653 # v6.0.0
        with:
          name: build-${{ github.run_id }}
          path: '@@WORKING_DIR@@/@@ARTIFACT_PATH@@'
          if-no-files-found: error
          retention-days: 7

  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0 # TODO(verify): pin immutable SHA; license may be required
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 # TODO(verify): pin immutable SHA
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python
        if: env.PROJECT_LANGUAGE == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '@@PYTHON_VERSION@@'
      - name: Set up Node.js
        if: env.PROJECT_LANGUAGE == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '@@NODE_VERSION@@'
      - uses: actions/cache@8ff5423e8b66eacab4e638ee52abbd2cb831366a # v5.0.1
        with:
          path: @@CACHE_PATH@@
          key: ${{ runner.os }}-deps-${{ hashFiles('@@WORKING_DIR@@/@@LOCKFILE@@') }}
      - name: Install test dependencies
        run: @@INSTALL_CMD@@
        working-directory: @@WORKING_DIR@@
      - name: Run tests
        env:
          ALLOW_NO_TESTS: ${{ vars.ALLOW_NO_TESTS }}
        run: |
          if [ '@@TEST_CMD@@' = 'NO_TESTS_DETECTED' ]; then
            echo "::warning::No tests detected."
            if [ "$ALLOW_NO_TESTS" = "true" ]; then exit 0; fi
            echo "::error::No tests detected. Add tests or set ALLOW_NO_TESTS=true."
            exit 1
          fi
          @@TEST_CMD@@
        working-directory: @@WORKING_DIR@@

  deploy:
    needs: [build, scan, test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/download-artifact@0d2ec9d4cbcefe257d822f108de2a1f15f8da9f6 # v7.0.0
        with:
          name: build-${{ github.run_id }}
          path: ./artifact
      - name: Verify downloaded build artifact
        run: test -n "$(find ./artifact -type f -print -quit)"
      - name: Deployment remains disabled until a target-specific job is configured
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          if [ "$DEPLOY_ENABLED" = "true" ]; then
            echo "::error::DEPLOY_ENABLED is true, but this generic template has no configured deploy target. Add and validate a target-specific deployment action before enabling it."
            exit 1
          fi
          echo "::notice::Build, scan and test completed. Deployment is disabled; configure a target-specific job before enabling releases."
